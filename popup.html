<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Code Generator — paste a link</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    width: 448px;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #F0FFF0;
    color: #3C403C;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .card {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    border: 1.5px solid #3C403C;
    border-radius: 16px;
    box-shadow: 8px 8px 0 #D8E6D8;
    padding: 28px;
  }
  .head { display: flex; align-items: center; gap: 10px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { margin-top: 5px; font-size: 12px; opacity: 0.65; }
  .link-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: 22px;
  }
  .link-head > span {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  button#tabBtn {
    background: none;
    border: none;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-decoration: underline;
    cursor: pointer;
    color: #3C403C;
    opacity: 0.7;
    padding: 4px;
  }
  button#tabBtn:hover { opacity: 1; }
  button#tabBtn[hidden] { display: none; }
  input#url {
    width: 100%;
    margin-top: 7px;
    padding: 12px 14px;
    font-size: 14px;
    border: 1.5px solid #3C403C;
    border-radius: 10px;
    background: #ffffff;
    color: #3C403C;
    outline: none;
    transition: box-shadow 0.15s ease;
  }
  input#url:focus { box-shadow: 3px 3px 0 #D8E6D8; }
  input#url::placeholder { color: rgba(60, 64, 60, 0.35); }
  .qr-stage { position: relative; margin-top: 18px; }
  .qr-wrap {
    aspect-ratio: 1 / 1;
    background: #ffffff;
    border: 1.5px solid #3C403C;
    border-radius: 10px;
    display: grid;
    place-items: center;
    padding: 14px;
    overflow: hidden;
  }
  .qr-wrap.empty { border-style: dashed; }
  .qr-wrap svg { width: 100%; height: 100%; display: block; }
  .hint { font-size: 12px; opacity: 0.55; text-align: center; padding: 0 16px; line-height: 1.6; }
  .encoded {
    margin-top: 10px;
    font-size: 11.5px;
    opacity: 0.65;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
    min-height: 15px;
  }
  button#download {
    margin-top: 16px;
    width: 100%;
    padding: 13px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: #3C403C;
    color: #F0FFF0;
    border: 1.5px solid #3C403C;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  button#download:hover:not(:disabled) { background: #D8E6D8; color: #3C403C; }
  button#download:disabled { opacity: 0.35; cursor: not-allowed; }
  .foot { margin-top: 14px; text-align: center; font-size: 11px; opacity: 0.5; }
  .logo-label {
    display: block;
    margin-top: 16px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .logo-label i { font-style: normal; text-transform: none; letter-spacing: 0; opacity: 0.55; }
  .logo-controls { margin-top: 7px; display: flex; align-items: center; gap: 10px; }
  button#logoBtn {
    padding: 9px 14px;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: #ffffff;
    color: #3C403C;
    border: 1.5px dashed #3C403C;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button#logoBtn:hover { background: #D8E6D8; }
  .logo-preview { display: flex; align-items: center; gap: 10px; width: 100%; }
  .logo-preview[hidden] { display: none; }
  .logo-preview img {
    width: 30px;
    height: 30px;
    object-fit: contain;
    border: 1.5px solid #3C403C;
    border-radius: 8px;
    background: #ffffff;
    padding: 2px;
  }
  input#logoSize { flex: 1; accent-color: #3C403C; }
  button#logoRemove {
    background: none;
    border: none;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-decoration: underline;
    cursor: pointer;
    color: #3C403C;
    opacity: 0.7;
    padding: 4px;
  }
  button#logoRemove:hover { opacity: 1; }
  .logo-overlay {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 22%;
    aspect-ratio: 1;
    object-fit: contain;
    background: #ffffff;
    padding: 7px;
    border-radius: 14%;
    pointer-events: none;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="head">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="2.5" y="2.5" width="7" height="7" rx="1" stroke="#3C403C" stroke-width="1.5"/>
        <rect x="4.75" y="4.75" width="2.5" height="2.5" fill="#3C403C"/>
        <rect x="14.5" y="2.5" width="7" height="7" rx="1" stroke="#3C403C" stroke-width="1.5"/>
        <rect x="16.75" y="4.75" width="2.5" height="2.5" fill="#3C403C"/>
        <rect x="2.5" y="14.5" width="7" height="7" rx="1" stroke="#3C403C" stroke-width="1.5"/>
        <rect x="4.75" y="16.75" width="2.5" height="2.5" fill="#3C403C"/>
        <rect x="14.5" y="14.5" width="3" height="3" fill="#3C403C"/>
        <rect x="18.5" y="18.5" width="3" height="3" fill="#3C403C"/>
        <rect x="14.5" y="18.5" width="1.5" height="1.5" fill="#3C403C"/>
        <rect x="18.5" y="14.5" width="1.5" height="1.5" fill="#3C403C"/>
      </svg>
      <h1>QR Code Generator</h1>
    </div>
    <p class="sub mono">Paste a link, get a QR code. Add a logo if you like.</p>

    <div class="link-head">
      <span class="mono">Link</span>
      <button id="tabBtn" class="mono" type="button" hidden>Use current tab</button>
    </div>
    <input id="url" class="mono" type="text" inputmode="url" autocomplete="off"
           spellcheck="false" placeholder="https://example.com"
           value="https://example.com" aria-label="Link" autofocus>

    <span class="logo-label mono">Logo <i>optional — the code still scans</i></span>
    <div class="logo-controls">
      <button id="logoBtn" class="mono" type="button">Add image</button>
      <input id="logoFile" type="file" accept="image/*" hidden>
      <div id="logoPreview" class="logo-preview" hidden>
        <img id="logoThumb" alt="Logo preview">
        <input id="logoSize" type="range" min="12" max="30" value="22" aria-label="Logo size">
        <button id="logoRemove" class="mono" type="button">Remove</button>
      </div>
    </div>

    <div class="qr-stage">
      <div id="qr" class="qr-wrap" aria-live="polite"></div>
      <img id="logoOverlay" class="logo-overlay" alt="" hidden>
    </div>
    <p id="encoded" class="encoded mono"></p>

    <button id="download" class="mono" type="button" disabled>Download PNG</button>
    <p class="foot mono">Generated locally in your browser — nothing is uploaded.</p>
  </main>

<script src="qrcode.js"></script>
<script src="popup.js"></script>
</body>
</html>
